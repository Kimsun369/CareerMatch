name: Daily ReliefWeb Job Ingestion

on:
  schedule:
    # Runs at 00:00 UTC every day (07:00 AM ICT / Cambodia time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Maximum jobs to ingest (up to 500)'
        required: false
        default: '500'
      deactivate_missing:
        description: 'Deactivate expired jobs past closing date'
        type: boolean
        required: false
        default: true

# Concurrency group ensures two ingestion jobs never run at the same time against Neon
concurrency:
  group: daily-job-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: ReliefWeb Daily Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Job Ingestion
        working-directory: Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME || 'careermatch-fyp' }}
          DJANGO_DEBUG: "False"
          PYTHONUNBUFFERED: "1"
        run: |
          MAX_RECORDS="${{ github.event.inputs.max_records || '500' }}"
          DEACTIVATE_FLAG=""
          if [ "${{ github.event.inputs.deactivate_missing }}" != "false" ]; then
            DEACTIVATE_FLAG="--deactivate-missing"
          fi
          echo "Starting ingestion with max-records: ${MAX_RECORDS} ${DEACTIVATE_FLAG}"
          python manage.py ingest_reliefweb --max-records "${MAX_RECORDS}" ${DEACTIVATE_FLAG}

