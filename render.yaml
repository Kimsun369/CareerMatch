services:
  - type: web
    name: careermatch-backend
    runtime: python
    rootDir: Backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn careermatch.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: RELIEFWEB_APPNAME
        value: "careermatch-fyp"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

